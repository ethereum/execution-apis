- name: trace_call
  summary: Executes an unsigned call and returns selected traces.
  description: Execute against the state at the end of the selected block, default latest, under its
    fork rules and block environment. Block accepts a number, tag or block hash; an unknown selected
    block returns an error (-32001, Resource not found, recommended), and a known block whose required state is pruned returns
    an error (4444 recommended). pending selects the client's pending block, the next block number built on latest with its
    pending transactions, and is accepted only when the client has such a pending environment; a client
    without one rejects it (-32602 recommended) rather than substitute another block (H32). Ordinary
    execution fees follow eth_call (H15). Omitted execution-fee fields default to 0. The effective gas
    price is gasPrice, or
    min(maxPriorityFeePerGas + base fee, maxFeePerGas), computed after defaulting; when it is 0, GASPRICE
    and BASEFEE are both 0 and no gas fee is paid. Blob simulation defaults, fee-cap validation and
    opcode-visible BLOBBASEFEE for omitted or zero blob pricing remain separately unresolved (H15); no
    universal zero rule is required. A covering positive blob cap and calls without blob fields preserve
    the selected block's BLOBBASEFEE. Defined blob fields must take effect or cause rejection, never be
    ignored. Other block
    fields are unchanged. Execution-fee validation is skipped only when both execution fee caps are 0, as with gasPrice 0.
    Omitted gas follows the client's eth_call default at the selected state, bounded by the server's
    execution cap; a block limit or sender allowance may lower that budget but never raise it above
    the cap. Supplied gas above the cap runs with the cap. Callers requiring a portable budget supply
    gas explicitly; the cap is server policy, not a truncated result. A validation failure is an error that reports its
    violation. A defect that makes the call object invalid regardless of state, such as a priority fee
    above the fee cap, an impossible type and field combination or an empty authorization list, takes
    precedence when several rules are violated (-32602 recommended); any other validation failure
    without a listed code recommends -32003 (Transaction rejected).
    Unsigned calls skip the EIP-3607 sender-code check, as eth_call does.
    Otherwise the price must cover the base fee (-38012 recommended), maxPriorityFeePerGas must not exceed
    maxFeePerGas (-32602 recommended), and the sender must fund the upfront cost (-38014 recommended); execution then charges
    the upfront gas payment, applies refunds, burns the base fee and pays the tip. A zero price does not
    exempt value transfers from funding. Validation rejections recommend the eth_simulateV1 codes listed below;
    malformed requests are rejected (-32602 recommended). Positional StateOverrides and BlockOverrides
    are preferred optional extensions, using the eth_simulateV1 schemas and applying before execution.
    Existing recognized configuration wrappers remain optional extensions where their contents take
    effect. The baseline call arity does not require either form. Reject an unsupported non-null override
    shape (-32602 recommended), never silently treat a state map as an empty configuration. Block
    overrides replace fields of the selected block environment, and the zero-fee rule then uses the
    overridden base fee. Simulated changes are
    discarded. EVM failure is trace output; invalid parameters or unavailable state are RPC errors
    (H08,H11,H14,H15,H28). Error codes named in this profile are recommended; conformance requires the
    error response itself. This is a provisional trace profile; see docs-api/docs/trace-profile.md and its
    decision references.
  params:
  - name: Call
    required: true
    schema:
      $ref: '#/components/schemas/TraceCall'
  - &id002
    name: TraceTypes
    required: true
    schema:
      $ref: '#/components/schemas/TraceTypes'
  - &id001
    name: Block
    required: false
    schema:
      title: Optional block, latest when omitted or null
      anyOf:
      - $ref: '#/components/schemas/BlockNumberOrTagOrHash'
      - type: 'null'
  - &stateOverrides
    name: StateOverrides
    required: false
    schema:
      title: Optional state overrides
      anyOf:
      - $ref: '#/components/schemas/TraceStateOverrides'
      - $ref: '#/components/schemas/TraceOverrideConfig'
      - type: 'null'
  - &blockOverrides
    name: BlockOverrides
    required: false
    schema:
      title: Optional block overrides
      anyOf:
      - $ref: '#/components/schemas/BlockOverrides'
      - type: 'null'
  result:
    name: Result
    schema:
      $ref: '#/components/schemas/TraceExecution'
  errors: &simulationErrors
  - code: -32601
    message: Method not found
  - code: -32602
    message: Invalid params
  - code: -32001
    message: Resource not found
  - code: 4444
    message: Pruned history unavailable
  - code: -38012
    message: Transactions baseFeePerGas is too low
  - code: -38013
    message: Not enough gas provided to pay for intrinsic gas for a transaction
  - code: -38014
    message: Insufficient funds to pay for gas fees and value for a transaction
  - code: -38025
    message: Max init code size exceeded
  - code: -38026
    message: Client adjustable limit exceeded
  - code: -32003
    message: Transaction rejected
  examples:
  - name: trace_call result shape
    description: Illustrative response shape; exact execution depends on chain state.
    params:
    - name: Call
      value:
        from: '0x1111111111111111111111111111111111111111'
        to: '0x2222222222222222222222222222222222222222'
        gas: '0x5208'
    - name: TraceTypes
      value: &id003 []
    - name: Block
      value: latest
    result:
      name: Result
      value: &id004
        output: 0x
        trace: []
        stateDiff: null
        vmTrace: null
- name: trace_callMany
  summary: Executes dependent unsigned calls in order.
  description: Each [call, traceTypes] item is a separate transaction executed in order on the preceding
    item's post-state. EIP-2200 and EIP-3529 original storage values, EIP-2929 access sets, EIP-1153
    transient storage, the refund counter and the EIP-6780 same-transaction scope all start afresh for
    each item. All items share one block environment, as selected for trace_call; NUMBER and TIMESTAMP
    do not advance between items. The first item runs against the same state and environment as
    trace_call at the selected block. The trace_call fee rules, including the zero-fee BASEFEE
    adjustment, apply to each item independently. Each stateDiff is relative to the preceding item's
    post-state. Reverted writes roll back and subsequent items continue; transaction-level nonce and fee
    effects survive. If any decoded item fails validation, return one error for the whole request, with
    the trace_call codes recommended; return no partial results. A client SHOULD include the failing
    item's zero-based index in error.data.index. If present, the index MUST identify the failing item. A
    malformed item is rejected without an index (-32602 recommended). A server may cap the item count or
    total gas only with an explicit
    error (-38026 recommended), never by truncating. Return one envelope per input in order. The sequence never changes
    canonical state. Empty input returns []. Block defaults to latest; preferred positional overrides or
    recognized existing override wrappers are optional, and accepted overrides apply once, before the
    first item, as for trace_call (H15,H16,H25,H31). Error codes named in this
    profile are recommended; conformance requires the error response itself. This is a provisional trace
    profile; see docs-api/docs/trace-profile.md and its decision references.
  params:
  - name: Calls
    required: true
    schema:
      type: array
      items:
        $ref: '#/components/schemas/TraceCallManyEntry'
  - *id001
  - *stateOverrides
  - *blockOverrides
  result:
    name: Result
    schema:
      type: array
      items:
        $ref: '#/components/schemas/TraceExecution'
  errors: *simulationErrors
  examples:
  - name: Fund an account then spend its simulated balance
    description: >-
      Illustrative sequence assuming the first sender has at least one wei, the second sender
      initially has zero balance, and both recipients have no code. Each call selects no trace
      families and uses zero fees. The second call spends the wei received from the first call;
      canonical state is unchanged.
    params:
    - name: Calls
      value:
      - - from: '0x1111111111111111111111111111111111111111'
          to: '0x2222222222222222222222222222222222222222'
          value: '0x1'
          gas: '0x5208'
          gasPrice: '0x0'
        - []
      - - from: '0x2222222222222222222222222222222222222222'
          to: '0x3333333333333333333333333333333333333333'
          value: '0x1'
          gas: '0x5208'
          gasPrice: '0x0'
        - []
    - name: Block
      value: latest
    result:
      name: Result
      value:
      - output: 0x
        trace: []
        stateDiff: null
        vmTrace: null
      - output: 0x
        trace: []
        stateDiff: null
        vmTrace: null
  - name: trace_callMany result shape
    description: Illustrative response shape; exact execution depends on chain state.
    params:
    - name: Calls
      value: []
    - name: Block
      value: latest
    result:
      name: Result
      value: []
- name: trace_rawTransaction
  summary: Simulates a signed transaction at latest state.
  description: Decode the signed transaction and validate it for execution against latest state before
    simulating it (H13). Apply the transaction validity rules of the selected fork, including signature,
    chain identity, nonce equality, sufficient balance for value and upfront gas, intrinsic gas, fees and
    sender-code restrictions (including permitted EIP-7702 delegation). Reject both low and high nonces;
    do not replace signed fields, override the sender nonce or top up its balance. This is execution
    validation, not transaction-pool admission; do not impose local replacement, already-known or minimum-tip
    policies. A decodable transaction that fails validation is rejected for the rule it violates; a
    transaction signed for another chain fails chain identity, whatever its recovered sender holds. The
    recommended codes are the eth_sendRawTransaction error groups,
    1 nonce too low, 2 nonce too high, 800 intrinsic gas, 804 priority fee above fee cap, 806 fee cap
    below base fee, 809 insufficient funds, and -32003 (Transaction rejected) for any other validation
    failure. A signed gas limit above the server's execution cap is not reduced; reject it (-38026 recommended).
    Malformed encodings or request parameters are rejected (-32602 recommended). A valid transaction that REVERTs or
    exceptionally halts returns an execution trace, not a validation error. The portable baseline
    defines two parameters and latest state. An explicitly supplied block-selector extension is outside
    this baseline; accepting it is not a baseline failure. Extension semantics require separate
    agreement. Validation failure returns a complete JSON-RPC error, not a partially serialized result
    (H12-H14,H25). Error codes named in this profile are recommended; conformance requires the error
    response itself. This is a provisional trace profile; see docs-api/docs/trace-profile.md and its
    decision references.
  params:
  - name: Transaction
    required: true
    schema:
      $ref: '#/components/schemas/TraceData'
  - *id002
  result:
    name: Result
    schema:
      $ref: '#/components/schemas/TraceExecution'
  errors:
  - code: -32601
    message: Method not found
  - code: -32602
    message: Invalid params
  - code: 1
    message: Nonce too low
  - code: 2
    message: Nonce too high
  - code: 800
    message: Intrinsic gas too low / Intrinsic gas exceeds gas limit
  - code: 804
    message: Max priority fee per gas higher than max fee per gas
  - code: 806
    message: Max fee per gas less than block base fee
  - code: 809
    message: Insufficient funds for gas * price + value
  - code: -32003
    message: Transaction rejected
  - code: -38026
    message: Client adjustable limit exceeded
  - code: 4444
    message: Pruned history unavailable
  examples:
  - name: trace_rawTransaction result shape
    description: Illustrative response shape; exact execution depends on chain state.
    params:
    - name: Transaction
      value: '0xf86a80847735940082520894000000000000000000000000000000000000123401808718e5bb3abd10a0a04c833abdb116ad76fc98610ae0e626d7e35154f1fba38ce6bfdaf69a31eec42ca035ecfb996cc68a2a03df0e1087194e25180b01bf0469f69b4f1d330eea9d027a'
    - name: TraceTypes
      value: *id003
    result:
      name: Result
      value: *id004
- name: trace_replayTransaction
  summary: Replays a mined transaction with selected traces.
  description: Reconstruct the state immediately before this transaction from the parent block's
    post-block state, applying this block's pre-transaction system operations and then its preceding
    transactions, under this block's fork rules. Return null for a transaction that is not in a
    canonical block; error for unavailable history. Report the transaction's actual committed state
    transition; block-level operations belong to no transaction's stateDiff (H06,H07,H16,H18,H28). Error
    codes named in this profile are recommended; conformance requires the error response itself. This
    is a provisional trace profile; see docs-api/docs/trace-profile.md and its decision references.
  params:
  - &id005
    name: TransactionHash
    required: true
    schema:
      $ref: '#/components/schemas/hash32'
  - *id002
  result:
    name: Result
    schema:
      anyOf:
      - $ref: '#/components/schemas/TraceReplay'
      - type: 'null'
  errors:
  - code: -32601
    message: Method not found
  - code: -32602
    message: Invalid params
  - code: 4444
    message: Pruned history unavailable
  examples:
  - name: trace_replayTransaction result shape
    description: Illustrative response shape; exact execution depends on chain state.
    params:
    - name: TransactionHash
      value: '0x1111111111111111111111111111111111111111111111111111111111111111'
    - name: TraceTypes
      value: *id003
    result:
      name: Result
      value: null
- name: trace_replayBlockTransactions
  summary: Replays every transaction in a block.
  description: 'Default block is not implicit: Block is required. Return exactly one envelope per
    transaction, in transaction order, each with its transactionHash. Empty blocks and the genesis block
    return []. Trace the block from its parent''s post-block state with its own pre-transaction system
    operations applied, under its own fork rules. System operations (EIP-4788 and EIP-2935 pre-block
    calls, EIP-7002 and EIP-7251 post-block calls), withdrawals and rewards are applied in protocol
    order but belong to no envelope; concatenated stateDiffs therefore do not reconstruct the block
    post-state. Block accepts pending only when the client has a pending block (the next block number
    with its pending transactions); otherwise pending is rejected (-32602 recommended). An unknown selected block returns
    null or an error (-32001, Resource not found, recommended); a known block whose required state is
    pruned returns an error (4444 recommended)
    (H05,H07,H16,H28,H32). Where an error is required, codes named in this profile are recommended. This
    is a provisional trace profile; see
    docs-api/docs/trace-profile.md and its decision references.'
  params:
  - &historicalBlock
    name: Block
    required: true
    schema:
      $ref: '#/components/schemas/BlockNumberOrTag'
  - *id002
  result:
    name: Result
    schema:
      anyOf:
      - type: array
        items:
          $ref: '#/components/schemas/TraceReplay'
      - type: 'null'
  errors: &blockErrors
  - code: -32601
    message: Method not found
  - code: -32602
    message: Invalid params
  - code: -32001
    message: Resource not found
  - code: 4444
    message: Pruned history unavailable
  examples:
  - name: trace_replayBlockTransactions result shape
    description: Illustrative response shape; exact execution depends on chain state.
    params:
    - name: Block
      value: latest
    - name: TraceTypes
      value: *id003
    result:
      name: Result
      value: []
- name: trace_block
  summary: Returns localized call traces for a block.
  description: Return transaction records in transaction-index order, each tree in preorder, followed
    by the block's historical PoW rewards, the block reward first and then uncle rewards in ommer order.
    The genesis block has no transaction or reward records and returns []. Do not emit synthetic zero
    PoW rewards after the Merge. Withdrawals and system operations are applied to state but are not
    trace records. Trace the block from its parent's post-block state with its own pre-transaction system
    operations applied, under its own fork rules. Block accepts pending only when the client has a
    pending block (the next block number with its pending transactions); otherwise pending is rejected
    (-32602 recommended). Records from the pending block carry its number and the hash of the block the client built,
    which is not canonical; numeric and tag selections otherwise carry canonical block hashes.
    Correct optional hash-selector extensions may return the requested noncanonical block's own records (H33).
    An unknown selected block
    returns null or an error (-32001, Resource not found, recommended); a known block whose required
    state is pruned returns an error (4444 recommended)
    (H05,H06,H27,H28,H32). Where an error is required, codes named in this profile are recommended. This
    is a provisional trace profile; see docs-api/docs/trace-profile.md and
    its decision references.
  params:
  - *historicalBlock
  result:
    name: Result
    schema:
      anyOf:
      - $ref: '#/components/schemas/TraceLocalizedFrames'
      - type: 'null'
  errors: *blockErrors
  examples:
  - name: trace_block result shape
    description: Illustrative response shape; exact execution depends on chain state.
    params:
    - name: Block
      value: latest
    result:
      name: Result
      value: []
- name: trace_transaction
  summary: Returns localized call traces for a mined transaction.
  description: Return a flat preorder tree, including the root. A transaction that is not in a canonical
    block returns null; unavailable state is an error. traceAddress is a path, not a flat list index
    (H02,H06). Error codes named in this profile are recommended; conformance requires the error
    response itself. This is a provisional trace profile; see docs-api/docs/trace-profile.md and its decision
    references.
  params:
  - *id005
  result:
    name: Result
    schema:
      anyOf:
      - $ref: '#/components/schemas/TraceLocalizedTransactionFrames'
      - type: 'null'
  errors:
  - code: -32601
    message: Method not found
  - code: -32602
    message: Invalid params
  - code: 4444
    message: Pruned history unavailable
  examples:
  - name: trace_transaction result shape
    description: Illustrative response shape; exact execution depends on chain state.
    params:
    - name: TransactionHash
      value: '0x1111111111111111111111111111111111111111111111111111111111111111'
    result:
      name: Result
      value: null
- name: trace_get
  summary: Returns the trace at one tree path.
  description: 'Position selects one traceAddress path: [] is root, ["0x0"] first child, ["0x6","0x0"]
    the first child of child six. Return one localized object, or null if the transaction is not in a
    canonical block or the path does not exist. Integer path entries are rejected (-32602 recommended),
    not treated as missing paths; convert traceAddress integers to hex quantities. Unavailable state is
    an error (H02,H06). Error codes named in this profile are recommended; conformance requires the
    error response itself. This is a provisional trace profile; see docs-api/docs/trace-profile.md and its decision references.'
  params:
  - *id005
  - name: Position
    required: true
    schema:
      $ref: '#/components/schemas/TracePosition'
  result:
    name: Result
    schema:
      anyOf:
      - $ref: '#/components/schemas/TraceLocalizedTransactionFrame'
      - type: 'null'
  errors:
  - code: -32601
    message: Method not found
  - code: -32602
    message: Invalid params
  - code: 4444
    message: Pruned history unavailable
  examples:
  - name: trace_get result shape
    description: Illustrative response shape; exact execution depends on chain state.
    params:
    - name: TransactionHash
      value: '0x1111111111111111111111111111111111111111111111111111111111111111'
    - name: Position
      value: []
    result:
      name: Result
      value: null
- name: trace_filter
  summary: Returns localized traces matching an address filter.
  description: An optional blockHash member selects exactly one block, using the eth_getLogs selector shape.
    Clients without support explicitly reject a non-null member (-32602 recommended), never ignore it;
    null is omitted even without support (H14). A non-null hash is mutually exclusive with non-null range
    bounds (-32602 recommended). Accepted collections, including [], belong entirely to the requested block
    and each record carries its own hash. Accurate noncanonical results may be served where supported;
    orphan support and retention are optional. Unknown, unexecuted or otherwise unavailable hashes return
    an error (-32001 recommended; 4444 for pruned required history), never null, [], partial results or
    another block's records. Validate the selector before a count 0 shortcut. Resolve and trace against
    one coherent view, preserving identity rather than scanning a replacement block at the same height.
    Apply OR within each address list and AND between the lists by default, as eth_getLogs composes topic positions;
    mode union matches either populated list; omitted/null/empty lists are unrestricted; compare address
    bytes independently of hex letter case.
    Omitted bounds mean latest through latest, resolved against one canonical head. As for eth_getLogs,
    if either bound resolves to a block number greater than the current head block, or fromBlock resolves
    above toBlock, return an error (-32602, Invalid params, recommended); an explicit toBlock before an omitted latest start is
    such a reversed range. Never clamp the range or return a partial result. Historical searches must
    explicitly set fromBlock. earliest means the lowest block the client has available; never replace
    an explicit endpoint with the retained-history boundary, and return an error (4444 recommended) when required history is
    unavailable. Resource limits produce errors, never silently narrowed ranges. count limits returned
    records, not scan or replay work. Indexed retrieval and replay must yield the same fork-correct
    per-block records, each block traced from its parent's post-block state.
    Match CALL sender/recipient, CREATE creator/created address and SELFDESTRUCT executing
    (self-destructing) account/beneficiary; after EIP-6780 that account usually survives. A record
    matches only addresses it reports; a failed CREATE reports no created address, so it has no
    created-address match. A reward matches toAddress by author and has no from side; in
    intersection mode it is excluded whenever fromAddress is populated, while in union mode a toAddress
    match suffices. The genesis block contributes no records. Order records by block, then transaction,
    then preorder, with each block's rewards after its transaction records (block reward, then uncle
    rewards in ommer order). Filter first, then skip after records and take count. Offsets are stable
    only for a fixed selection. Capture one coherent snapshot for the request; numeric and tag ranges
    select its canonical blocks (H03-H06,H23,H27,H30,H32,H33). Error codes named in this profile are
    recommended; conformance requires
    the error response itself. This is a provisional trace profile; see docs-api/docs/trace-profile.md
    and its decision references.
  params:
  - name: Filter
    required: true
    schema:
      $ref: '#/components/schemas/TraceFilter'
  result:
    name: Result
    schema:
      $ref: '#/components/schemas/TraceLocalizedFrames'
  errors:
  - code: -32601
    message: Method not found
  - code: -32602
    message: Invalid params
  - code: -32001
    message: Resource not found
  - code: 4444
    message: Pruned history unavailable
  examples:
  - name: trace_filter result shape
    description: Illustrative response shape; exact execution depends on chain state.
    params:
    - name: Filter
      value:
        fromBlock: '0x1'
        toBlock: '0x1'
    result:
      name: Result
      value: []
