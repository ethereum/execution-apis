TraceData:
  title: Trace byte string
  type: string
  pattern: ^0x([0-9a-f]{2})*$
TraceTypes:
  title: Requested trace outputs
  type: array
  uniqueItems: true
  items:
    type: string
    enum:
    - trace
    - stateDiff
    - vmTrace
  description: An empty array is valid and requests execution output only (H11).
TraceCall:
  type: object
  required: []
  properties:
    from: &nullableAddress
      anyOf:
      - &id001
        $ref: '#/components/schemas/address'
      - type: 'null'
    to: *nullableAddress
    gas: &nullableUint64
      anyOf:
      - $ref: '#/components/schemas/uint64'
      - type: 'null'
    gasPrice: &nullableUint256
      anyOf:
      - &id002
        $ref: '#/components/schemas/uint256'
      - type: 'null'
    maxFeePerGas: *nullableUint256
    maxPriorityFeePerGas: *nullableUint256
    value: *nullableUint256
    data: &nullableData
      anyOf:
      - &id003
        $ref: '#/components/schemas/TraceData'
      - type: 'null'
    input: *nullableData
    nonce: *nullableUint64
    type:
      anyOf:
      - $ref: '#/components/schemas/byte'
      - type: 'null'
    accessList:
      anyOf:
      - $ref: '#/components/schemas/AccessList'
      - type: 'null'
    chainId: *nullableUint256
    maxFeePerBlobGas: *nullableUint256
    blobVersionedHashes:
      anyOf:
      - type: array
        items:
          $ref: '#/components/schemas/hash32'
      - type: 'null'
    authorizationList:
      anyOf:
      - $ref: '#/components/schemas/AuthorizationList'
      - type: 'null'
  not:
    required: [gasPrice]
    properties:
      gasPrice:
        not:
          type: 'null'
    anyOf:
    - required: [maxFeePerGas]
      properties:
        maxFeePerGas:
          not:
            type: 'null'
    - required: [maxPriorityFeePerGas]
      properties:
        maxPriorityFeePerGas:
          not:
            type: 'null'
  additionalProperties: true
  description: 'Unsigned simulation. The fields are those of the eth_simulateV1 GenericCallTransaction,
    with chainId and authorizationList as in GenericTransaction, plus data as a compatibility alias for
    input. When data and input are both present they MUST be equal; otherwise return -32602. Every field
    defined here MUST either take effect with its eth_call meaning or cause the request to be rejected
    (-32602 for a malformed field or impossible combination, or -32003 when the selected fork does not
    support the field, such as authorizationList before Prague); a client MUST NOT silently ignore a
    defined field. Only fields outside this schema are ignored, and accepting
    them does not establish extension support (H14). An explicit null for any field other than to is the
    same as omitting it. Omitted or null to creates a contract. Defaults: from
    zero address, value zero, input empty; omitted gas, and gas above the client execution cap, use that cap as in eth_call. Omitted gasPrice,
    maxFeePerGas and maxPriorityFeePerGas default to 0 as in eth_call and eth_simulateV1; maxFeePerBlobGas
    defaults to 0 when blobVersionedHashes are present (H15). Legacy gasPrice and dynamic fee fields MUST
    NOT be combined. A supplied nonce is accepted but neither validated nor used: execution, including
    CREATE address derivation, uses the sender nonce in the selected state. A supplied chainId must match
    the chain.'
  title: TraceCall
TraceCallManyEntry:
  type: array
  minItems: 2
  maxItems: 2
  items:
  - $ref: '#/components/schemas/TraceCall'
  - $ref: '#/components/schemas/TraceTypes'
  title: TraceCallManyEntry
TraceAddress:
  type: array
  items: &id004
    type: integer
    minimum: 0
  title: TraceAddress
TracePosition:
  type: array
  items:
    $ref: '#/components/schemas/uint64'
  description: 'One path into the call tree: [] selects the root, ["0x0"] its first child (H02). Output
    traceAddress uses JSON integers; the input path uses hex quantities for compatibility with existing
    callers. Convert each output integer to a minimal hex quantity before querying. Integer path entries
    are invalid parameters (-32602), not missing paths.'
  title: TracePosition
TraceFilter:
  type: object
  required: []
  properties:
    fromBlock: &rangeBound
      anyOf:
      - $ref: '#/components/schemas/BlockNumberOrTagForRange'
      - type: 'null'
    toBlock: *rangeBound
    fromAddress:
      anyOf:
      - type: array
        items: *id001
      - type: 'null'
    toAddress:
      anyOf:
      - type: array
        items: *id001
      - type: 'null'
    mode:
      anyOf:
      - type: string
        enum:
        - intersection
        - union
      - type: 'null'
      description: intersection (default) requires every populated address list to match; union requires
        any populated list to match. null is the default. Unknown values are invalid parameters (-32602).
    after: &pageSize
      anyOf:
      - type: integer
        minimum: 0
        maximum: 18446744073709551615
      - type: 'null'
    count: *pageSize
  additionalProperties: false
  description: An explicit null member is the same as an omitted one. Inclusive block range; defaults omitted fromBlock and toBlock to the same latest head,
    after 0, count unlimited subject to an explicit server limit. Bounds exclude pending and block
    hashes. If either bound resolves beyond the current head block, or fromBlock resolves above
    toBlock, return -32602; an explicit toBlock before an omitted latest start is such a reversed
    range. Never clamp the range.
    OR within each address list; AND between lists by default, as eth_getLogs composes topic positions.
    Missing, null or empty lists are unrestricted. mode union matches either populated list instead.
    Compare address bytes independently of hex letter case. Resolve tags once per request. Apply
    filtering before pagination; count 0 returns []. after and count are JSON integers bounded by
    uint64. Return an error rather than silently truncate when a server limit is exceeded. earliest is
    the lowest available block; never replace an explicit endpoint with a retention boundary, and
    return 4444 if required history is unavailable. count limits results, not scan or replay work
    (H03,H04,H06,H23,H27,H30,H32).
  title: TraceFilter
TraceCallAction:
  type: object
  required:
  - callType
  - from
  - to
  - gas
  - input
  - value
  properties:
    callType:
      type: string
      enum:
      - call
      - callcode
      - delegatecall
      - staticcall
    from: *id001
    to: *id001
    gas: *id002
    input: *id003
    value: *id002
  description: 'CALL and STATICCALL: from is the caller, to the target. DELEGATECALL and CALLCODE: from
    is the executing address, to the code address. value is the transferred value; DELEGATECALL reports
    the inherited value and STATICCALL 0. Root gas is the transaction gas minus intrinsic gas, including
    access-list and authorization costs. Nested gas is the gas forwarded after the EIP-150 63/64 cap,
    plus the 2300 stipend for a value transfer (H09,H29).'
  title: TraceCallAction
TraceCreateAction:
  type: object
  required:
  - from
  - gas
  - init
  - value
  - creationMethod
  properties:
    from: *id001
    gas: *id002
    init: *id003
    value: *id002
    creationMethod:
      type: string
      enum:
      - create
      - create2
  description: from is the creator and init the initcode. Root gas is the transaction gas minus intrinsic
    gas; nested gas is all but 1/64 of the caller's remaining gas. creationMethod distinguishes CREATE
    from CREATE2 and is required on every create action (H10).
  title: TraceCreateAction
TraceSuicideAction:
  type: object
  required:
  - address
  - refundAddress
  - balance
  properties:
    address: *id001
    refundAddress: *id001
    balance: *id002
  description: Records a SELFDESTRUCT opcode and the balance it transferred from address to
    refundAddress, not account deletion; after EIP-6780 the account usually survives.
  title: TraceSuicideAction
TraceRewardAction:
  type: object
  required:
  - author
  - value
  - rewardType
  properties:
    author: *id001
    value: *id002
    rewardType:
      type: string
      enum:
      - block
      - uncle
  description: A historical PoW block or uncle reward paid to author. Withdrawals and system operations
    are not reward records (H05).
  title: TraceRewardAction
TraceCallResult:
  type: object
  required:
  - gasUsed
  - output
  properties:
    gasUsed: *id002
    output: *id003
  description: gasUsed is the frame's execution gas before refunds; for the root it excludes intrinsic
    gas and the EIP-7623 floor. output is the frame's return or revert bytes.
  title: TraceCallResult
TraceCreateResult:
  type: object
  required:
  - gasUsed
  - address
  - code
  properties:
    gasUsed: *id002
    address: *id001
    code: *id003
  description: Successful creation. gasUsed is execution gas before refunds, including the code deposit;
    for the root it excludes intrinsic gas and the EIP-7623 floor. code is the deployed runtime bytecode
    (H10).
  title: TraceCreateResult
TraceRevertedCreateResult:
  type: object
  required: [gasUsed, output]
  properties:
    gasUsed: *id002
    output: *id003
  not:
    anyOf:
    - required: [address]
    - required: [code]
  description: A reverted creation reports its gas and revert bytes, never an address or deployed code,
    because no contract exists at the would-be address (H09,H23).
  title: TraceRevertedCreateResult
TraceFrame:
  title: Flat call trace record
  description: 'Preorder traversal. Retain root precompile calls regardless of value. Omit nested precompile
    frames with zero value; retain nested frames with nonzero transferred or inherited value, whether
    successful or failed. A precompile is an address in the precompile set active at the executing
    block''s fork. traceAddress gives child ordinals and subtraces counts direct children in the
    emitted tree, excluding omitted frames (H29). Omitting a call frame must not omit its caller VM
    return-memory effects. A CALL-family call that fails its precheck (call depth limit or
    insufficient balance) emits a frame with its action and error, no result and no subtraces; the
    forwarded gas returns to the caller. A CREATE or CREATE2 that fails its precheck (call depth limit,
    insufficient balance or nonce overflow) emits the same kind of frame before Amsterdam; from
    Amsterdam the check runs in the creating opcode and no frame is emitted. A CREATE whose address
    collides emits a create frame with error "Contract address collision" that consumes its gas.
    Standalone historical records require localization; only protocol rewards have null transaction
    fields. Frames inside simulation and replay envelopes omit localization and protocol rewards.
    error alone determines failure. A REVERT frame has error "Reverted" and a required result
    {gasUsed, output} carrying its revert bytes, for CREATE too, without address or code: no contract
    exists at the would-be address. An exceptional halt consumes the frame''s action gas; its result
    may be omitted or null. Failure labels are "Reverted", "Out of gas", "Bad instruction", "Bad jump
    destination", "Stack underflow", "Out of stack", "Mutable Call In Static Context", "Built-in
    failed" and "Out of bounds". As in Parity and OpenEthereum, a code-deposit failure, including code
    above the EIP-170 size limit, is "Out of gas", and returned code starting with 0xEF (EIP-3541) is
    "Invalid code". Beyond Parity, which reported an address collision as "Out of gas" and emitted no
    frame for a failed precheck, use "Contract address collision", "Nonce overflow", "Insufficient
    balance for transfer" and "Max call depth exceeded". EIP-3860 oversized initcode aborts the
    creating frame with "Out of gas". The designated invalid instruction 0xFE is an undefined opcode,
    so its frame fails with "Bad instruction". Any other error string is an extension that consumers
    treat as a generic failure. revertReason is not part of this profile; raw revert bytes live in
    result.output. A suicide frame records the SELFDESTRUCT opcode and its transfer, not account
    deletion (H05,H09,H10,H24).'
  oneOf:
  - type: object
    required:
    - type
    - action
    - subtraces
    - traceAddress
    properties:
      subtraces: &count
        type: integer
        minimum: 0
      traceAddress: &id005
        $ref: '#/components/schemas/TraceAddress'
      type:
        const: call
      action:
        $ref: '#/components/schemas/TraceCallAction'
      result:
        anyOf:
        - $ref: '#/components/schemas/TraceCallResult'
        - type: 'null'
      error:
        type: string
      revertReason:
        type: string
    oneOf:
    - title: Successful CALL
      description: Successful frame; result is required and error must be absent.
      required:
      - result
      not:
        required:
        - error
      properties:
        result:
          $ref: '#/components/schemas/TraceCallResult'
    - title: Reverted CALL
      description: REVERT; result carries the frame's gas and revert bytes.
      required:
      - error
      - result
      properties:
        error:
          const: Reverted
        result:
          $ref: '#/components/schemas/TraceCallResult'
    - title: Halted CALL
      description: Exceptional halt; result is omitted or null.
      required:
      - error
      properties:
        error: &haltError
          not:
            const: Reverted
        result:
          type: 'null'
  - type: object
    required:
    - type
    - action
    - subtraces
    - traceAddress
    properties:
      subtraces: *count
      traceAddress: *id005
      type:
        const: create
      action:
        $ref: '#/components/schemas/TraceCreateAction'
      result:
        anyOf:
        - $ref: '#/components/schemas/TraceCreateResult'
        - $ref: '#/components/schemas/TraceRevertedCreateResult'
        - type: 'null'
      error:
        type: string
      revertReason:
        type: string
    oneOf:
    - title: Successful CREATE
      description: Successful frame; result is required and error must be absent.
      required:
      - result
      not:
        required:
        - error
      properties:
        result:
          $ref: '#/components/schemas/TraceCreateResult'
    - title: Reverted CREATE
      description: REVERT; result carries the frame's gas and revert bytes, without address or code.
      required:
      - error
      - result
      properties:
        error:
          const: Reverted
        result:
          $ref: '#/components/schemas/TraceRevertedCreateResult'
    - title: Halted CREATE
      description: Exceptional halt, including an address collision; result is omitted or null.
      required:
      - error
      properties:
        error: *haltError
        result:
          type: 'null'
  - type: object
    required:
    - type
    - action
    - subtraces
    - traceAddress
    properties:
      subtraces: *count
      traceAddress: *id005
      type:
        const: suicide
      action:
        $ref: '#/components/schemas/TraceSuicideAction'
      result:
        type: 'null'
  - type: object
    required:
    - type
    - action
    - subtraces
    - traceAddress
    properties:
      subtraces: *count
      traceAddress: *id005
      type:
        const: reward
      action:
        $ref: '#/components/schemas/TraceRewardAction'
      result:
        type: 'null'
# Context constraints are separate from the shared action/result union. Keep
# their keywords disjoint so the generator's limited allOf merger preserves them.
TraceTransactionFrame:
  title: Transaction call trace record
  allOf:
  - $ref: '#/components/schemas/TraceFrame'
  - type: object
    properties:
      type:
        enum: [call, create, suicide]
TraceUnlocalizedFrame:
  title: Call trace record inside an execution envelope
  allOf:
  - $ref: '#/components/schemas/TraceTransactionFrame'
  - not:
      anyOf:
      - required: [blockHash]
      - required: [blockNumber]
      - required: [transactionHash]
      - required: [transactionPosition]
TraceFrames:
  type: array
  items:
    $ref: '#/components/schemas/TraceUnlocalizedFrame'
  title: TraceFrames
TraceLocalizedFrames:
  type: array
  items:
    $ref: '#/components/schemas/TraceLocalizedFrame'
  title: TraceLocalizedFrames
TraceLocalizedFrame:
  title: Historical call trace record or protocol reward
  allOf:
  - $ref: '#/components/schemas/TraceFrame'
  - type: object
    required: [blockHash, blockNumber, transactionHash, transactionPosition]
    properties:
      blockHash:
        $ref: '#/components/schemas/hash32'
      blockNumber: *id004
    if:
      properties:
        type:
          const: reward
      required: [type]
    then:
      properties:
        transactionHash:
          type: 'null'
        transactionPosition:
          type: 'null'
    else:
      properties:
        transactionHash:
          $ref: '#/components/schemas/hash32'
        transactionPosition: *id004
TraceLocalizedTransactionFrame:
  title: Historical transaction call trace record
  allOf:
  - $ref: '#/components/schemas/TraceLocalizedFrame'
  - type: object
    properties:
      type:
        enum: [call, create, suicide]
TraceLocalizedTransactionFrames:
  title: Historical transaction call traces
  type: array
  items:
    $ref: '#/components/schemas/TraceLocalizedTransactionFrame'
TraceQuantityChange:
  oneOf:
  - const: '='
  - type: object
    required:
    - +
    properties:
      +: *id002
    additionalProperties: false
  - type: object
    required:
    - '-'
    properties:
      '-': *id002
    additionalProperties: false
  - type: object
    required:
    - '*'
    properties:
      '*':
        type: object
        required:
        - from
        - to
        properties:
          from: *id002
          to: *id002
        additionalProperties: false
    additionalProperties: false
  title: TraceQuantityChange
TraceCodeChange:
  oneOf:
  - const: '='
  - type: object
    required:
    - +
    properties:
      +: *id003
    additionalProperties: false
  - type: object
    required:
    - '-'
    properties:
      '-': *id003
    additionalProperties: false
  - type: object
    required:
    - '*'
    properties:
      '*':
        type: object
        required:
        - from
        - to
        properties:
          from: *id003
          to: *id003
        additionalProperties: false
    additionalProperties: false
  title: TraceCodeChange
TraceStorageChange:
  oneOf:
  - type: object
    required:
    - +
    properties:
      +: &id010
        $ref: '#/components/schemas/bytes32'
    additionalProperties: false
  - type: object
    required:
    - '*'
    properties:
      '*':
        type: object
        required:
        - from
        - to
        properties:
          from: *id010
          to: *id010
        additionalProperties: false
    additionalProperties: false
  description: '+ lists a nonzero post-state slot of a born account. * changes a slot of an account that
    exists at both endpoints, with 32-byte from and to words, including zero words. Slots never use =
    and never use - (H17,H26).'
  title: TraceStorageChange
TraceAccountDiff:
  type: object
  required:
  - balance
  - nonce
  - code
  - storage
  properties:
    balance:
      $ref: '#/components/schemas/TraceQuantityChange'
    nonce:
      $ref: '#/components/schemas/TraceQuantityChange'
    code:
      $ref: '#/components/schemas/TraceCodeChange'
    storage:
      type: object
      patternProperties:
        ^0x[0-9a-f]{64}$:
          $ref: '#/components/schemas/TraceStorageChange'
      additionalProperties: false
  oneOf:
  - title: Born account
    description: Absent before and present after; every field uses +, and storage lists nonzero slots.
    properties:
      balance: &born
        type: object
        required: [+]
      nonce: *born
      code: *born
      storage:
        patternProperties:
          ^0x[0-9a-f]{64}$: *born
  - title: Deleted account
    description: Present before and absent after; every field uses -, and storage is empty because
      deletion wipes all storage.
    properties:
      balance: &died
        type: object
        required: ['-']
      nonce: *died
      code: *died
      storage:
        maxProperties: 0
  - title: Existing account
    description: Present at both endpoints; fields use = or *, slots use *, and at least one value changed.
    properties:
      balance: &kept
        oneOf:
        - const: '='
        - type: object
          required: ['*']
      nonce: *kept
      code: *kept
      storage:
        patternProperties:
          ^0x[0-9a-f]{64}$:
            type: object
            required: ['*']
    not:
      properties:
        balance:
          const: '='
        nonce:
          const: '='
        code:
          const: '='
        storage:
          maxProperties: 0
  title: TraceAccountDiff
TraceStateDiff:
  type: object
  patternProperties:
    ^0x[0-9a-f]{40}$:
      $ref: '#/components/schemas/TraceAccountDiff'
  additionalProperties: false
  description: 'Net committed state changes for this execution, comparing the execution endpoints. An
    account appears only if its balance, nonce, code, storage or existence changed. Existence means
    presence in the state trie: an existing EIP-161-empty account removed by touch-clearing is a
    deletion. + and - appear only when the account is born or dies; = marks an unchanged field and *
    a changed field of an account that exists at both endpoints. A born account includes zero nonce and
    empty code creation markers and lists its nonzero post-state slots. A deleted account has empty
    storage; its - implies all storage is wiped. Reverted EVM writes are absent; surviving
    transaction-level changes remain. callMany diffs are relative to each preceding post-state.
    Multiple authorization writes are reduced to their net effect, including nonce changes when final
    code equals initial code. An account absent at both endpoints has no account diff. The sender pays
    value, gasUsed times the effective gas price and blobGasUsed times the blob base fee; base and blob
    fees are burned or credited to a chain-defined collector, and the tip goes to the fee recipient.
    Block-level operations (EIP-4788 and EIP-2935 pre-block calls, withdrawals, EIP-7002 and EIP-7251
    post-block calls, rewards) belong to no transaction''s diff, so concatenated diffs do not
    reconstruct the block post-state (H16-H18,H26).'
  title: TraceStateDiff
TraceVm:
  $id: https://ethereum.github.io/execution-apis/schemas/trace-vm.json
  title: Recursive VM execution trace
  type: object
  required:
  - code
  - ops
  properties:
    # This resource has its own base URI. Primitive definitions must be local;
    # component pointers would resolve inside TraceVm, not the OpenRPC document.
    code: &vmData
      title: Trace byte string
      type: string
      pattern: ^0x([0-9a-f]{2})*$
    ops:
      type: array
      items:
        type: object
        required:
        - pc
        - cost
        - ex
        - sub
        properties:
          pc: *id004
          cost: *id004
          ex:
            anyOf:
            - type: object
              required:
              - used
              - push
              - mem
              - store
              properties:
                used: *id004
                push:
                  type: array
                  items: &vmQuantity
                    title: hex encoded 256 bit unsigned integer
                    type: string
                    pattern: ^0x(0|[1-9a-f][0-9a-f]{0,63})$
                mem:
                  anyOf:
                  - type: object
                    required:
                    - 'off'
                    - data
                    properties:
                      'off': *id004
                      data: *vmData
                  - type: 'null'
                store:
                  anyOf:
                  - type: object
                    required:
                    - key
                    - val
                    properties:
                      key: *vmQuantity
                      val: *vmQuantity
                  - type: 'null'
            - type: 'null'
          sub:
            anyOf:
            - $ref: '#'
            - type: 'null'
          op:
            type: string
          idx:
            type: string
        if:
          required: [ex]
          properties:
            ex:
              type: 'null'
        then:
          properties:
            sub:
              type: 'null'
  description: 'code is the actually executed bytecode, including initcode and resolved delegated
    code. ops lists every operation that began executing; operations rejected before execution
    (undefined opcodes including the designated invalid 0xFE, stack underflow or overflow) are
    omitted, and there is no synthetic STOP, so every pc lies inside code. cost is the total gas
    deducted from the caller when the operation starts, including gas made available to a child
    frame: the 63/64-capped forwarded gas for the CALL family, excluding the value stipend, and all
    but 1/64 for the CREATE family; this also holds when the call or creation fails its balance or
    depth precheck and the gas is returned immediately. ex records same-step effects; ex.used is the
    caller''s remaining gas after the operation, including unused gas returned by a child. An
    operation that halted exceptionally has ex null and sub null; its cost is an
    implementation-defined non-negative integer. push is the top k stack words after execution,
    deepest first, as minimal quantities, where k is the number of words the opcode leaves in place
    of its inputs (DUPn and SWAPn n+1, CALL and CREATE 1 after the child returns). mem is the
    post-operation contents of the memory range designated by the operands: MSTORE and MLOAD [off,
    off+32), MSTORE8 [off, off+1), the destination of CALLDATACOPY, CODECOPY, EXTCODECOPY,
    RETURNDATACOPY and MCOPY; for the CALL family, either the full output window (preferred) or
    exactly the bytes copied from return data, starting at the output offset. Consumers must not
    infer returned-data length from mem. mem is null when that range is empty or the opcode
    designates none (for example RETURN, REVERT, LOG, KECCAK256 and CREATE). These deltas do not
    encode allocated memory size. store is set only by SSTORE, from its key and value operands as
    quantities, whenever the SSTORE completes, even if the value is unchanged; TSTORE and SLOAD
    never set it. sub is the trace of the child frame this operation entered, including precompile
    and empty-code targets, which give {code: 0x, ops: []} when no instruction ran; it is null when
    the operation entered no frame, such as a failed precheck or SELFDESTRUCT. op and idx are
    optional annotations (H19-H21).'
TraceExecution:
  type: object
  required:
  - output
  - trace
  - stateDiff
  - vmTrace
  properties:
    output: *id003
    trace: &id011
      $ref: '#/components/schemas/TraceFrames'
    stateDiff: &id012
      anyOf:
      - $ref: '#/components/schemas/TraceStateDiff'
      - type: 'null'
    vmTrace: &id013
      anyOf:
      - $ref: '#/components/schemas/TraceVm'
      - type: 'null'
  description: output always contains actual return bytes, including when only stateDiff is selected.
    Unrequested trace is [], stateDiff and vmTrace are null. A selected vmTrace is always an object, even
    for an EOA or precompile target (H08,H20).
  title: TraceExecution
TraceReplay:
  type: object
  required:
  - output
  - trace
  - stateDiff
  - vmTrace
  - transactionHash
  properties:
    output: *id003
    trace: *id011
    stateDiff: *id012
    vmTrace: *id013
    transactionHash:
      $ref: '#/components/schemas/hash32'
  description: Execution envelope with the replayed transaction hash (H07).
  title: TraceReplay
