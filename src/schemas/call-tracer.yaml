CallFrame:
  title: Call frame
  description: >-
    A single call frame produced by the callTracer. The root frame represents
    the transaction's top-level call or create; nested frames appear in the
    calls array in execution order.

    Field presence rules: absent fields MUST be omitted entirely, never
    serialized as null or as an empty placeholder. The input field MUST always
    be present ("0x" when empty). Calls to precompiled contracts MUST be
    reported as frames like any other call, unless onlyTopCall is set.

    Gas semantics: on the root frame, gas MUST be the transaction gas limit and
    gasUsed MUST equal the receipt gasUsed (including intrinsic gas and
    refunds). On nested frames, gas is the gas available to that frame and
    gasUsed is the gas consumed by it. A nested frame that fails with an
    error other than REVERT (e.g. out of gas, an invalid opcode, a
    write-protection violation, a failed precompile or a CREATE/CREATE2
    address collision) consumes all of its gas, so its gasUsed MUST equal its
    gas. The exception is a frame that fails the call depth limit or the
    balance check before execution starts: it consumes none of its gas, so its
    gasUsed MUST be 0x0. SELFDESTRUCT frames MUST report gas and gasUsed as
    0x0; the opcode's cost is part of the parent frame.

    Frame presence: a frame is reported for each call or create that the
    parent opcode makes, including one that then fails the call depth limit
    or, for CALL and CALLCODE, the balance check. A CREATE or CREATE2 that
    fails the call depth, balance or nonce check is reported as a frame
    before Amsterdam. Since Amsterdam (EIP-8037) the CREATE opcode makes
    these checks itself, so no frame is reported. An opcode that halts
    before it makes the call, for example a CALL that transfers value in a
    static context, reports no frame.

    The calls array references this schema through its $id. In
    refs-openrpc.json that reference is #/components/schemas/CallFrame and the
    $id is removed. In the dereferenced openrpc.json the $id URI is an
    identifier, not a network location: per JSON Schema, the self-reference
    resolves against the embedded $id within the containing document, and no
    schema document is published at that URL.
  $id: 'https://ethereum.github.io/execution-apis/schemas/calltracer/callframe'
  type: object
  required:
    - type
    - from
    - gas
    - gasUsed
    - input
  properties:
    type:
      title: call type
      description: >-
        The frame's opcode mnemonic. The root frame is CALL for a message call
        transaction or CREATE for a deployment transaction.
      type: string
      enum:
        - CALL
        - CALLCODE
        - DELEGATECALL
        - STATICCALL
        - CREATE
        - CREATE2
        - SELFDESTRUCT
    from:
      title: sender
      description: >-
        The address the frame executes on behalf of. For DELEGATECALL and
        CALLCODE frames this is the calling frame's context address, including
        in nested delegatecall chains.
      $ref: '#/components/schemas/address'
    to:
      title: recipient
      description: >-
        The call target, created contract address (CREATE/CREATE2), or refund
        beneficiary (SELFDESTRUCT). MUST be present on all frames except
        CREATE and CREATE2 frames that failed, where it MUST be omitted since
        no contract was created.
      $ref: '#/components/schemas/address'
    value:
      title: transferred value
      description: >-
        The value transferred by this frame in wei. MUST be present, including
        when zero, for all frame types except STATICCALL, where it MUST be
        omitted. For DELEGATECALL frames this is the value of the calling
        context (delegatecall transfers no value itself).
      $ref: '#/components/schemas/uint256'
    gas:
      title: gas provided
      $ref: '#/components/schemas/uint'
    gasUsed:
      title: gas used
      $ref: '#/components/schemas/uint'
    input:
      title: call data
      description: >-
        The call data, or the initcode for CREATE/CREATE2 frames. Always
        present; "0x" when empty.
      $ref: '#/components/schemas/bytes'
    output:
      title: return data
      description: >-
        The data returned by the frame, or the deployed runtime code for
        successful CREATE/CREATE2 frames. On a reverted frame this is the raw
        revert data. MUST be omitted when empty.
      $ref: '#/components/schemas/bytes'
    error:
      title: execution error
      description: >-
        The error that halted the frame. MUST be omitted on success. MUST be
        exactly "execution reverted" when the frame halted due to REVERT;
        other failure messages are client-specific free text, but SHOULD
        identify the failure class (e.g. out of gas, write protection).
      type: string
    revertReason:
      title: decoded revert reason
      description: >-
        The human-readable revert reason. MUST be present if and only if the
        frame reverted and its revert data decodes as the standard
        Panic(uint256) ABI encoding, or as Error(string) with a non-empty
        string. For Error(string) it is the decoded string. For Panic(uint256) it is a short description of
        the panic code; the exact text is client-defined.
      type: string
    calls:
      title: nested calls
      description: >-
        Frames created by this frame, in execution order. MUST be omitted (not
        an empty array) when there are none, and always when onlyTopCall is
        set.
      type: array
      items:
        $ref: 'https://ethereum.github.io/execution-apis/schemas/calltracer/callframe'
    logs:
      title: emitted logs
      description: >-
        Logs emitted by this frame. Only present when the withLog tracer
        option is set. MUST be omitted when the frame emitted no logs, and
        MUST be omitted from reverted frames and their descendants, whose logs
        never take effect.
      type: array
      items:
        $ref: '#/components/schemas/CallLog'

CallLog:
  title: Call frame log
  description: >-
    A log emitted by a call frame, reported when the withLog tracer option is
    set.
  type: object
  required:
    - address
    - topics
    - data
    - position
    - index
  properties:
    address:
      title: log emitter
      $ref: '#/components/schemas/address'
    topics:
      title: log topics
      type: array
      items:
        $ref: '#/components/schemas/bytes32'
    data:
      title: log data
      $ref: '#/components/schemas/bytes'
    position:
      title: position among subcalls
      description: >-
        The number of subcalls the containing frame had created when this log
        was emitted; i.e. the log's position relative to the frame's calls
        array, allowing the interleaving of logs and subcalls to be
        reconstructed. When onlyTopCall is set, no subcall frames are collected
        and position is 0 for every log.
      $ref: '#/components/schemas/uint'
    index:
      title: log index
      description: >-
        The log's index within the block: the number of logs that took effect
        in the block before this one, counting the logs of all preceding
        transactions. It MUST equal the logIndex of the same log in the
        transaction receipt. Logs of reverted frames never take effect and do
        not consume an index, and onlyTopCall does not change the numbering.
        For debug_traceCall, where no receipt exists, numbering starts at zero
        for the traced call.
      $ref: '#/components/schemas/uint'

CallTracerConfig:
  title: callTracer configuration
  description: >-
    The tracerConfig object accepted when tracer is "callTracer". Clients MUST
    honor both options. Clients MAY accept additional tracer-specific
    configuration fields (e.g. go-ethereum accepts none beyond these, Erigon
    accepts includePrecompiles); such extensions are outside the scope of this
    specification and MUST NOT change the behavior specified here when absent.
  type: object
  properties:
    onlyTopCall:
      title: only top call
      description: >-
        When true, only the root frame is reported; the calls array is omitted
        everywhere and no subcall frames are collected. Defaults to false.
      type: boolean
    withLog:
      title: collect logs
      description: >-
        When true, logs emitted by each frame are collected into its logs
        array. Defaults to false.
      type: boolean

CallTracerBlockEntry:
  title: Call tracer block entry
  description: >-
    A per-transaction entry in a block trace produced with the callTracer.
    Either result (the transaction's root call frame) or error (the reason
    this transaction could not be traced) is present.
  type: object
  required:
    - txHash
  anyOf:
    - required:
        - result
    - required:
        - error
  properties:
    txHash:
      title: transaction hash
      $ref: '#/components/schemas/hash32'
    result:
      title: transaction call trace
      $ref: '#/components/schemas/CallFrame'
    error:
      title: trace failure
      description: The error that prevented tracing this transaction.
      type: string
