- name: engine_getInclusionListV1
  summary: Obtains an inclusion list based on the local view of the mempool
  externalDocs:
    description: Method specification
    url: https://github.com/ethereum/execution-apis/blob/main/src/engine/bogota.md#engine_getinclusionlistv1
  params: []
  result:
    name: Inclusion list transactions
    schema:
      type: array
      maxItems: 8192
      items:
        $ref: '#/components/schemas/InclusionListTransactionV1'
- name: engine_getInclusionListStatusV1
  summary: Obtains the execution and inclusion status for a registered context
  externalDocs:
    description: Method specification
    url: https://github.com/ethereum/execution-apis/blob/main/src/engine/bogota.md#engine_getinclusionliststatusv1
  params:
    - name: Inclusion list context id
      required: true
      schema:
        $ref: '#/components/schemas/hash32'
  result:
    name: Payload status
    schema:
      title: Execution and inclusion status
      $ref: '#/components/schemas/PayloadStatusV2'
  errors:
    - code: -38007
      message: Unknown inclusion context
    - code: -32602
      message: Invalid params
  examples:
    - name: Pending inclusion check for a valid execution payload
      params:
        - name: Inclusion list context id
          value: '0x1111111111111111111111111111111111111111111111111111111111111111'
      result:
        name: Payload status
        value:
          status: VALID
          latestValidHash: '0x2222222222222222222222222222222222222222222222222222222222222222'
          validationError: null
          inclusionListSatisfied: null
          inclusionListContextId: '0x1111111111111111111111111111111111111111111111111111111111111111'
    - name: Completed unsatisfied inclusion check
      params:
        - name: Inclusion list context id
          value: '0x1111111111111111111111111111111111111111111111111111111111111111'
      result:
        name: Payload status
        value:
          status: VALID
          latestValidHash: '0x2222222222222222222222222222222222222222222222222222222222222222'
          validationError: null
          inclusionListSatisfied: false
          inclusionListContextId: '0x1111111111111111111111111111111111111111111111111111111111111111'
