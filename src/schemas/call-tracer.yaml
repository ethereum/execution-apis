CallFrame:
  title: Call frame
  description: >-
    A single call frame produced by the callTracer. The root frame represents
    the transaction's top-level call or create; nested frames appear in the
    calls array in execution order.

    Field presence rules: absent fields MUST be omitted entirely, never
    serialized as null or as an empty placeholder. The input field MUST always
    be present ("0x" when empty). Calls to precompiled contracts MUST be
    reported as frames like any other call, unless onlyTopCall is set.

    Gas semantics: on the root frame, gas MUST be the transaction gas limit and
    gasUsed MUST equal the receipt gasUsed (including intrinsic gas and
    refunds). On nested frames, gas is the gas available to that frame and
    gasUsed is the gas consumed by it.

    Two-dimensional gas (EIP-8037, Amsterdam and later): execution gas and
    state gas are metered separately. State gas is drawn from a state-gas
    reservoir first and from the frame's remaining gas (gas_left) once the
    reservoir is exhausted. gas and gasUsed keep their meaning as amounts of
    gas_left and are not split by dimension. The root frame additionally
    reports the transaction's contribution to each block gas counter
    (executionGasUsed, stateGasUsed) and its refund (gasRefund); any frame may
    report stateGasUsed and stateGasReservoir. None of these fields are
    present for transactions before the Amsterdam fork. For debug_traceCall
    they are computed as if the call were included as a transaction.

    Root frame invariants (Amsterdam and later): with before_refund the gas
    used by the transaction before refunds, and floor the calldata floor
    (calldata_floor_gas_cost of EIP-8037, per EIP-7623 as amended by EIP-7976
    and EIP-2780), gasUsed == max(before_refund - gasRefund, floor) and
    executionGasUsed == max(before_refund - stateGasUsed, floor). Hence
    executionGasUsed + stateGasUsed == gasUsed + gasRefund whenever floor does
    not exceed before_refund - max(gasRefund, stateGasUsed). Because the floor
    is applied to each quantity separately, it can bind for executionGasUsed
    but not for gasUsed, in which case executionGasUsed + stateGasUsed exceeds
    gasUsed + gasRefund.

    The calls array references this schema through its $id. The $id URI is an
    identifier, not a network location: per JSON Schema, the self-reference
    resolves against the embedded $id within the containing document, and no
    schema document is published at that URL.
  $id: 'https://ethereum.github.io/execution-apis/schemas/calltracer/callframe'
  type: object
  required:
    - type
    - from
    - gas
    - gasUsed
    - input
  properties:
    type:
      title: call type
      description: >-
        The frame's opcode mnemonic. The root frame is CALL for a message call
        transaction or CREATE for a deployment transaction.
      type: string
      enum:
        - CALL
        - CALLCODE
        - DELEGATECALL
        - STATICCALL
        - CREATE
        - CREATE2
        - SELFDESTRUCT
    from:
      title: sender
      description: >-
        The address the frame executes on behalf of. For DELEGATECALL and
        CALLCODE frames this is the calling frame's context address, including
        in nested delegatecall chains.
      $ref: '#/components/schemas/address'
    to:
      title: recipient
      description: >-
        The call target, created contract address (CREATE/CREATE2), or refund
        beneficiary (SELFDESTRUCT). MUST be present on all frames except
        CREATE and CREATE2 frames that failed, where it MUST be omitted since
        no contract was created.
      $ref: '#/components/schemas/address'
    value:
      title: transferred value
      description: >-
        The value transferred by this frame in wei. MUST be present, including
        when zero, for all frame types except STATICCALL, where it MUST be
        omitted. For DELEGATECALL frames this is the value of the calling
        context (delegatecall transfers no value itself).
      $ref: '#/components/schemas/uint256'
    gas:
      title: gas provided
      description: >-
        The gas available to this frame. On the root frame this is the
        transaction gas limit. On nested frames it is the gas forwarded to the
        frame; from the Amsterdam fork (EIP-8037) this excludes the state-gas
        reservoir, which is reported separately as stateGasReservoir.
      $ref: '#/components/schemas/uint'
    gasUsed:
      title: gas used
      description: >-
        The gas consumed by this frame. On the root frame this equals the
        transaction receipt gasUsed. On nested frames it is gas minus the
        gas_left the frame returns to the calling frame on exit, after the
        frame's state-gas rollback if it reverted; a frame that halts
        exceptionally returns nothing, so its gasUsed equals gas. From the
        Amsterdam fork (EIP-8037) it therefore includes state gas the frame
        drew from gas_left after the reservoir was exhausted and did not credit
        back, and excludes state gas funded from the reservoir. It is not a
        per-dimension quantity; stateGasUsed reports the state dimension.
      $ref: '#/components/schemas/uint'
    executionGasUsed:
      title: execution gas used (block contribution)
      description: >-
        EIP-8037 (Amsterdam and later), root frame only. The transaction's
        contribution to the block's execution-gas counter
        (block_execution_gas_used): max(before_refund - stateGasUsed, floor),
        as defined in the CallFrame description. It is not reduced by the
        refund (EIP-7778), and summing it over a block's transactions yields
        block_execution_gas_used. MUST be present on the root frame of
        Amsterdam and later transactions, and MUST be omitted on nested frames
        and before the Amsterdam fork. Earlier drafts of EIP-8037 called this
        dimension regular gas; clients MUST use the name executionGasUsed.
      $ref: '#/components/schemas/uint'
    stateGasUsed:
      title: state gas used
      description: >-
        EIP-8037 (Amsterdam and later). On the root frame, the transaction's
        contribution to the block's state-gas counter (block_state_gas_used),
        i.e. evm_state_gas_used at the end of the transaction. It includes the
        state gas charged in the pre-execution phase of EIP-2780 (new accounts
        and delegation indicators of EIP-7702 authorizations, and the
        new-account charge for the transaction's recipient or deployment
        address), is net of state-gas refills, and is never negative. It MUST
        be present on the root frame of Amsterdam and later transactions.

        On nested frames, clients MAY include it: the net change in
        evm_state_gas_used between the frame's entry and its exit, after the
        frame's own rollback. It covers state gas charged and refilled within
        the frame and its descendants, including the code-deposit charge of a
        CREATE or CREATE2 frame, but not the charge the calling frame applies
        for the operation that created the frame (the new-account charge of a
        value-bearing CALL, or of a CREATE or CREATE2 to a non-existent
        address). It is zero for frames that reverted or halted, and negative
        for a frame that refills more than it charges, for example one that
        clears a storage slot that was zero at transaction start and was
        allocated by an earlier frame. MUST be omitted before the Amsterdam
        fork.
      $ref: '#/components/schemas/int'
    gasRefund:
      title: gas refund
      description: >-
        EIP-8037 (Amsterdam and later), root frame only. The refund applied to
        the transaction before the calldata floor: min(before_refund / 5,
        refund counter at the end of the transaction), using integer division
        (tx_gas_refund of EIP-8037). It is reported unchanged when the calldata
        floor absorbs part or all of it, in which case gasUsed exceeds
        before_refund - gasRefund. MUST be present on the root frame of
        Amsterdam and later transactions, and MUST be omitted on nested frames
        and before the Amsterdam fork.
      $ref: '#/components/schemas/uint'
    stateGasReservoir:
      title: state-gas reservoir at entry
      description: >-
        EIP-8037 (Amsterdam and later). The state-gas reservoir available to
        this frame when it is entered. On the root frame this is the reservoir
        after the pre-execution phase. A calling frame passes its entire
        reservoir to a child frame (the 63/64 rule applies to gas_left only),
        so on nested frames this is the calling frame's reservoir at the call,
        after any state gas the call itself was charged. The reservoir starts
        non-zero only when the transaction gas limit exceeds the EIP-7825
        transaction gas limit cap, but refills can add to it. Clients MAY
        include this field. MUST be omitted before the Amsterdam fork.
      $ref: '#/components/schemas/uint'
    input:
      title: call data
      description: >-
        The call data, or the initcode for CREATE/CREATE2 frames. Always
        present; "0x" when empty.
      $ref: '#/components/schemas/bytes'
    output:
      title: return data
      description: >-
        The data returned by the frame, or the deployed runtime code for
        successful CREATE/CREATE2 frames. On a reverted frame this is the raw
        revert data. MUST be omitted when empty.
      $ref: '#/components/schemas/bytes'
    error:
      title: execution error
      description: >-
        The error that halted the frame. MUST be omitted on success. MUST be
        exactly "execution reverted" when the frame halted due to REVERT;
        other failure messages are client-specific free text, but SHOULD
        identify the failure class (e.g. out of gas, write protection).
      type: string
    revertReason:
      title: decoded revert reason
      description: >-
        The human-readable revert reason, present only when the frame reverted
        and its revert data decodes as the standard Error(string) ABI encoding.
      type: string
    calls:
      title: nested calls
      description: >-
        Frames created by this frame, in execution order. MUST be omitted (not
        an empty array) when there are none, and always when onlyTopCall is
        set.
      type: array
      items:
        $ref: 'https://ethereum.github.io/execution-apis/schemas/calltracer/callframe'
    logs:
      title: emitted logs
      description: >-
        Logs emitted by this frame. Only present when the withLog tracer
        option is set. MUST be omitted when the frame emitted no logs, and
        MUST be omitted from reverted frames and their descendants, whose logs
        never take effect.
      type: array
      items:
        $ref: '#/components/schemas/CallLog'

CallLog:
  title: Call frame log
  description: >-
    A log emitted by a call frame, reported when the withLog tracer option is
    set.
  type: object
  required:
    - address
    - topics
    - data
    - position
    - index
  properties:
    address:
      title: log emitter
      $ref: '#/components/schemas/address'
    topics:
      title: log topics
      type: array
      items:
        $ref: '#/components/schemas/bytes32'
    data:
      title: log data
      $ref: '#/components/schemas/bytes'
    position:
      title: position among subcalls
      description: >-
        The number of subcalls the containing frame had created when this log
        was emitted; i.e. the log's position relative to the frame's calls
        array, allowing the interleaving of logs and subcalls to be
        reconstructed. When onlyTopCall is set, no subcall frames are collected
        and position is 0 for every log.
      $ref: '#/components/schemas/uint'
    index:
      title: log index
      description: >-
        The log's index within the block: the number of logs that took effect
        in the block before this one, counting the logs of all preceding
        transactions. It MUST equal the logIndex of the same log in the
        transaction receipt. Logs of reverted frames never take effect and do
        not consume an index, and onlyTopCall does not change the numbering.
        For debug_traceCall, where no receipt exists, numbering starts at zero
        for the traced call.
      $ref: '#/components/schemas/uint'

CallTracerConfig:
  title: callTracer configuration
  description: >-
    The tracerConfig object accepted when tracer is "callTracer". Clients MUST
    honor both options. Clients MAY accept additional tracer-specific
    configuration fields (e.g. go-ethereum accepts none beyond these, Erigon
    accepts includePrecompiles); such extensions are outside the scope of this
    specification and MUST NOT change the behavior specified here when absent.
  type: object
  properties:
    onlyTopCall:
      title: only top call
      description: >-
        When true, only the root frame is reported; the calls array is omitted
        everywhere and no subcall frames are collected. Defaults to false.
      type: boolean
    withLog:
      title: collect logs
      description: >-
        When true, logs emitted by each frame are collected into its logs
        array. Defaults to false.
      type: boolean

CallTracerBlockEntry:
  title: Call tracer block entry
  description: >-
    A per-transaction entry in a block trace produced with the callTracer.
    Either result (the transaction's root call frame) or error (the reason
    this transaction could not be traced) is present.
  type: object
  required:
    - txHash
  anyOf:
    - required:
        - result
    - required:
        - error
  properties:
    txHash:
      title: transaction hash
      $ref: '#/components/schemas/hash32'
    result:
      title: transaction call trace
      $ref: '#/components/schemas/CallFrame'
    error:
      title: trace failure
      description: The error that prevented tracing this transaction.
      type: string
