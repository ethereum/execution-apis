NewPendingTransactionsNotification:
  title: Pending transaction notification
  description: Notification for newPendingTransactions. The result is a transaction hash by default, or a PendingTransactionInfo object when the full-transaction flag is true.
  type: object
  additionalProperties: false
  required:
    - jsonrpc
    - method
    - params
  properties:
    jsonrpc:
      title: JSON-RPC version
      type: string
      pattern: ^2\.0$
    method:
      title: notification method
      type: string
      pattern: ^eth_subscription$
    params:
      title: notification parameters
      type: object
      additionalProperties: false
      required:
        - subscription
        - result
      properties:
        subscription:
          title: subscription ID
          $ref: '#/components/schemas/uint'
        result:
          title: pending transaction
          oneOf:
            - $ref: '#/components/schemas/hash32'
            - $ref: '#/components/schemas/PendingTransactionInfo'

TransactionReceiptsNotification:
  title: Transaction receipts notification
  description: Receipt array for transactions included in the latest imported block.
  type: object
  additionalProperties: false
  required:
    - jsonrpc
    - method
    - params
  properties:
    jsonrpc:
      title: JSON-RPC version
      type: string
      pattern: ^2\.0$
    method:
      title: notification method
      type: string
      pattern: ^eth_subscription$
    params:
      title: notification parameters
      type: object
      additionalProperties: false
      required:
        - subscription
        - result
      properties:
        subscription:
          title: subscription ID
          $ref: '#/components/schemas/uint'
        result:
          title: notification result
          type: array
          items:
            $ref: '#/components/schemas/ReceiptInfo'

LogsNotification:
  title: Log notification
  description: Surviving log matching the subscription filter, or a removed log after a chain reorganization.
  type: object
  additionalProperties: false
  required:
    - jsonrpc
    - method
    - params
  properties:
    jsonrpc:
      title: JSON-RPC version
      type: string
      pattern: ^2\.0$
    method:
      title: notification method
      type: string
      pattern: ^eth_subscription$
    params:
      title: notification parameters
      type: object
      additionalProperties: false
      required:
        - subscription
        - result
      properties:
        subscription:
          title: subscription ID
          $ref: '#/components/schemas/uint'
        result:
          title: notification result
          $ref: '#/components/schemas/Log'
