- name: engine_getInclusionListV1
  summary: Obtains an inclusion list based on the local view of the mempool
  externalDocs:
    description: Method specification
    url: https://github.com/ethereum/execution-apis/blob/main/src/engine/bogota.md#engine_getinclusionlistv1
  params: []
  result:
    name: Inclusion list transactions
    schema:
      type: array
      items:
        $ref: '#/components/schemas/bytes'
- name: engine_getInclusionListV2
  summary: Obtains an inclusion list with its proof based on the local view of the mempool
  externalDocs:
    description: Method specification
    url: https://github.com/ethereum/execution-apis/blob/main/src/engine/bogota.md#engine_getinclusionlistv2
  params: []
  result:
    name: Inclusion list
    schema:
      $ref: '#/components/schemas/InclusionListV1'
  errors:
    - code: -38005
      message: Unsupported fork
  examples:
