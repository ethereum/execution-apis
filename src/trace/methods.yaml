- name: trace_call
  summary: Executes an unsigned call and returns selected traces.
  description: >-
    Executes a call without creating a transaction, against the state at the end of the selected
    block under its fork rules and block environment, and returns the call's output with the
    requested traces. Simulated changes are discarded. The trace_* notes describe the fee, gas,
    validation and error rules.
  params:
  - name: Call
    required: true
    schema:
      $ref: '#/components/schemas/TraceCall'
  - &id002
    name: TraceTypes
    required: true
    schema:
      $ref: '#/components/schemas/TraceTypes'
  - &id001
    name: Block
    required: false
    description: >-
      Execution runs against the state at the end of the selected block, under its fork rules and
      block environment; in trace_callMany the first item runs against that state. Block accepts a
      number, tag or block hash, and defaults to latest; an unknown selected block
      returns an error (-32001, Resource not found), and a known block whose required state is
      pruned returns an error (4444 recommended). A block hash, as a string or an object, selects
      that block even when it is not canonical, as in eth_call; with requireCanonical true a
      noncanonical hash returns an error (-32001). pending selects the client's pending block, the
      next block number built on latest with its pending transactions, and is accepted only when
      the client has such a pending environment; a client without one rejects it (-32602
      recommended) rather than substitute another block.
    schema:
      title: Optional block, latest when omitted or null
      anyOf:
      - $ref: '#/components/schemas/BlockNumberOrTagOrHash'
      - type: 'null'
  - &stateOverrides
    name: StateOverrides
    required: false
    description: >-
      Optional; a client need not accept overrides in either form. This positional form, using the
      eth_simulateV1 StateOverrides schema, is preferred; an existing recognized configuration
      wrapper (TraceOverrideConfig) may be accepted where its contents take effect. Accepted
      overrides apply before execution, in trace_callMany once before the first item. Reject an
      unsupported non-null override shape (-32602 recommended), never silently treat a state map as
      an empty configuration.
    schema:
      title: Optional state overrides
      anyOf:
      - $ref: '#/components/schemas/StateOverrides'
      - $ref: '#/components/schemas/TraceOverrideConfig'
      - type: 'null'
  - &blockOverrides
    name: BlockOverrides
    required: false
    description: >-
      Optional; a client need not accept it. Uses the eth_simulateV1 BlockOverrides schema and
      applies before execution, in trace_callMany once before the first item. Block overrides
      replace fields of the selected block environment, and the zero-fee rule then uses the
      overridden base fee. Reject an unsupported non-null override shape (-32602 recommended).
    schema:
      title: Optional block overrides
      anyOf:
      - $ref: '#/components/schemas/BlockOverrides'
      - type: 'null'
  result:
    name: Result
    schema:
      $ref: '#/components/schemas/TraceExecution'
  errors: &simulationErrors
  - code: -32601
    message: Method not found
  - code: -32602
    message: Invalid params
  - code: -32001
    message: Resource not found
  - code: 4444
    message: Pruned history unavailable
  - code: -38012
    message: Transactions baseFeePerGas is too low
  - code: -38013
    message: Not enough gas provided to pay for intrinsic gas for a transaction
  - code: -38014
    message: Insufficient funds to pay for gas fees and value for a transaction
  - code: -38025
    message: Max init code size exceeded
  - code: -38026
    message: Client adjustable limit exceeded
  - code: -32003
    message: Transaction rejected
  examples:
  - name: trace_call result shape
    description: Illustrative response shape; exact execution depends on chain state.
    params:
    - name: Call
      value:
        from: '0x1111111111111111111111111111111111111111'
        to: '0x2222222222222222222222222222222222222222'
        gas: '0x5208'
    - name: TraceTypes
      value: &id003 []
    - name: Block
      value: latest
    result:
      name: Result
      value: &id004
        output: 0x
        trace: []
        stateDiff: null
        vmTrace: null
- name: trace_callMany
  summary: Executes dependent unsigned calls in order.
  description: >-
    Each [call, traceTypes] item is a separate transaction executed in order on the preceding
    item's post-state. All items share the selected block's environment, the sequence never changes
    canonical state, and the result holds one execution envelope per item, in input order. The
    trace_* notes describe how items are executed and how a failing item is reported.
  params:
  - name: Calls
    required: true
    description: One [call, traceTypes] item per transaction. Empty input returns [].
    schema:
      title: Calls with their trace types
      type: array
      items:
        $ref: '#/components/schemas/TraceCallManyEntry'
  - *id001
  - *stateOverrides
  - *blockOverrides
  result:
    name: Result
    schema:
      title: Execution results in call order
      type: array
      items:
        $ref: '#/components/schemas/TraceExecution'
  errors: *simulationErrors
  examples:
  - name: Fund an account then spend its simulated balance
    description: >-
      Illustrative sequence assuming the first sender has at least one wei, the second sender
      initially has zero balance, and both recipients have no code. Each call selects no trace
      families and uses zero fees. The second call spends the wei received from the first call;
      canonical state is unchanged.
    params:
    - name: Calls
      value:
      - - from: '0x1111111111111111111111111111111111111111'
          to: '0x2222222222222222222222222222222222222222'
          value: '0x1'
          gas: '0x5208'
          gasPrice: '0x0'
        - []
      - - from: '0x2222222222222222222222222222222222222222'
          to: '0x3333333333333333333333333333333333333333'
          value: '0x1'
          gas: '0x5208'
          gasPrice: '0x0'
        - []
    - name: Block
      value: latest
    result:
      name: Result
      value:
      - output: 0x
        trace: []
        stateDiff: null
        vmTrace: null
      - output: 0x
        trace: []
        stateDiff: null
        vmTrace: null
  - name: trace_callMany result shape
    description: Illustrative response shape; exact execution depends on chain state.
    params:
    - name: Calls
      value: []
    - name: Block
      value: latest
    result:
      name: Result
      value: []
- name: trace_rawTransaction
  summary: Simulates a signed transaction at latest state.
  description: >-
    Validates a signed transaction for execution against the latest state and simulates it,
    returning the transaction's output with the requested traces. A transaction that fails
    validation returns an error; a valid transaction that reverts or halts returns its trace. The
    trace_* notes list the validation rules and error codes.
  params:
  - name: Transaction
    required: true
    description: >-
      The signed transaction, simulated at latest state. Malformed encodings are rejected (-32602
      recommended).
    schema:
      $ref: '#/components/schemas/TraceData'
  - *id002
  result:
    name: Result
    schema:
      $ref: '#/components/schemas/TraceExecution'
  errors:
  - code: -32601
    message: Method not found
  - code: -32602
    message: Invalid params
  - code: 1
    message: Nonce too low
  - code: 2
    message: Nonce too high
  - code: 800
    message: Intrinsic gas too low / Intrinsic gas exceeds gas limit
  - code: 804
    message: Max priority fee per gas higher than max fee per gas
  - code: 806
    message: Max fee per gas less than block base fee
  - code: 809
    message: Insufficient funds for gas * price + value
  - code: -32003
    message: Transaction rejected
  - code: -38026
    message: Client adjustable limit exceeded
  - code: 4444
    message: Pruned history unavailable
  examples:
  - name: trace_rawTransaction result shape
    description: Illustrative response shape; exact execution depends on chain state.
    params:
    - name: Transaction
      value: '0xf86a80847735940082520894000000000000000000000000000000000000123401808718e5bb3abd10a0a04c833abdb116ad76fc98610ae0e626d7e35154f1fba38ce6bfdaf69a31eec42ca035ecfb996cc68a2a03df0e1087194e25180b01bf0469f69b4f1d330eea9d027a'
    - name: TraceTypes
      value: *id003
    result:
      name: Result
      value: *id004
- name: trace_replayTransaction
  summary: Replays a mined transaction with selected traces.
  description: >-
    Replays a mined transaction on the state immediately before it and returns its output and hash
    with the requested traces. The result is null if the transaction is not in a canonical block.
  params:
  - &id005
    name: TransactionHash
    required: true
    description: >-
      Hash of a mined transaction. A transaction that is not in a canonical block gives a null
      result; for a known transaction, unavailable history or state is an error, not null.
    schema:
      $ref: '#/components/schemas/hash32'
  - *id002
  result:
    name: Result
    schema:
      title: Replay envelope, or null for an unknown transaction
      anyOf:
      - $ref: '#/components/schemas/TraceReplay'
      - type: 'null'
  errors:
  - code: -32601
    message: Method not found
  - code: -32602
    message: Invalid params
  - code: 4444
    message: Pruned history unavailable
  examples:
  - name: trace_replayTransaction result shape
    description: Illustrative response shape; exact execution depends on chain state.
    params:
    - name: TransactionHash
      value: '0x1111111111111111111111111111111111111111111111111111111111111111'
    - name: TraceTypes
      value: *id003
    result:
      name: Result
      value: null
- name: trace_replayBlockTransactions
  summary: Replays every transaction in a block.
  description: >-
    Replays every transaction in a block and returns exactly one envelope per transaction, in
    transaction order, each with its transactionHash. Block-level operations such as system calls,
    withdrawals and rewards belong to no envelope; empty blocks and the genesis block return [].
  params:
  - &historicalBlock
    name: Block
    required: true
    description: >-
      Block is required; there is no implicit default block. Block accepts pending only when the
      client has a pending block (the next block number with its pending transactions); otherwise
      pending is rejected (-32602 recommended). Localized records traced from the pending block
      carry its number and the hash of the block the client built, which is not canonical; all
      other records carry canonical block hashes. An unknown selected block returns an error (-32001,
      Resource not found); a known block whose required state is pruned returns an error (4444
      recommended).
    schema:
      $ref: '#/components/schemas/BlockNumberOrTag'
  - *id002
  result:
    name: Result
    schema:
      title: Replay envelopes in transaction order
      type: array
      items:
        $ref: '#/components/schemas/TraceReplay'
  errors: &blockErrors
  - code: -32601
    message: Method not found
  - code: -32602
    message: Invalid params
  - code: -32001
    message: Resource not found
  - code: 4444
    message: Pruned history unavailable
  examples:
  - name: trace_replayBlockTransactions result shape
    description: Illustrative response shape; exact execution depends on chain state.
    params:
    - name: Block
      value: latest
    - name: TraceTypes
      value: *id003
    result:
      name: Result
      value: []
- name: trace_block
  summary: Returns localized call traces for a block.
  description: >-
    Returns the call traces of every transaction in a block, in transaction-index order with each
    tree in preorder, followed by the block's historical PoW rewards, the block reward first and
    then uncle rewards in ommer order. The genesis block has no transaction or reward records and
    returns [].
  params:
  - *historicalBlock
  result:
    name: Result
    schema:
      title: Localized traces of the block
      $ref: '#/components/schemas/TraceLocalizedFrames'
  errors: *blockErrors
  examples:
  - name: trace_block result shape
    description: Illustrative response shape; exact execution depends on chain state.
    params:
    - name: Block
      value: latest
    result:
      name: Result
      value: []
- name: trace_transaction
  summary: Returns localized call traces for a mined transaction.
  description: >-
    Returns the call traces of a mined transaction as a flat list in preorder, starting with the
    root. The result is null if the transaction is not in a canonical block.
  params:
  - *id005
  result:
    name: Result
    schema:
      title: Localized traces of the transaction, or null when it is unknown
      anyOf:
      - $ref: '#/components/schemas/TraceLocalizedTransactionFrames'
      - type: 'null'
  errors:
  - code: -32601
    message: Method not found
  - code: -32602
    message: Invalid params
  - code: 4444
    message: Pruned history unavailable
  examples:
  - name: trace_transaction result shape
    description: Illustrative response shape; exact execution depends on chain state.
    params:
    - name: TransactionHash
      value: '0x1111111111111111111111111111111111111111111111111111111111111111'
    result:
      name: Result
      value: null
- name: trace_get
  summary: Returns the trace at one tree path.
  description: >-
    Returns the call trace at one path in a mined transaction's call tree. The result is null if the
    transaction is not in a canonical block or the path does not exist.
  params:
  - *id005
  - name: Position
    required: true
    description: >-
      One traceAddress path into the call tree: [] selects the root, ["0x0"] its first child,
      ["0x6","0x0"] the first child of child six. Output traceAddress uses JSON integers; the input
      path uses hex quantities for compatibility with existing callers. Convert each output integer
      to a minimal hex quantity before querying. Integer path entries are rejected as invalid
      parameters (-32602 recommended), not treated as missing paths.
    schema:
      $ref: '#/components/schemas/TracePosition'
  result:
    name: Result
    schema:
      title: Trace at the path, or null when there is none
      anyOf:
      - $ref: '#/components/schemas/TraceLocalizedTransactionFrame'
      - type: 'null'
  errors:
  - code: -32601
    message: Method not found
  - code: -32602
    message: Invalid params
  - code: 4444
    message: Pruned history unavailable
  examples:
  - name: trace_get result shape
    description: Illustrative response shape; exact execution depends on chain state.
    params:
    - name: TransactionHash
      value: '0x1111111111111111111111111111111111111111111111111111111111111111'
    - name: Position
      value: []
    result:
      name: Result
      value: null
- name: trace_filter
  summary: Returns localized traces matching an address filter.
  description: >-
    Returns the call traces and rewards that match an address filter, from an inclusive block range
    or from one block selected by hash. Records are ordered by block, then transaction, then
    preorder, with each block's rewards after its transaction records. The trace_* notes describe
    ranges, matching, pagination and resource limits.
  params:
  - name: Filter
    required: true
    schema:
      $ref: '#/components/schemas/TraceFilter'
  result:
    name: Result
    schema:
      $ref: '#/components/schemas/TraceLocalizedFrames'
  errors:
  - code: -32601
    message: Method not found
  - code: -32602
    message: Invalid params
  - code: -32001
    message: Resource not found
  - code: 4444
    message: Pruned history unavailable
  examples:
  - name: trace_filter result shape
    description: Illustrative response shape; exact execution depends on chain state.
    params:
    - name: Filter
      value:
        fromBlock: '0x1'
        toBlock: '0x1'
    result:
      name: Result
      value: []
